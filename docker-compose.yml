# Production-style stack for the home server. AWS (S3 + DynamoDB) is the backend; see infra/terraform.
#   cp .env.example .env && docker compose up -d --build
#   docker compose --profile tunnel up -d     # also start the Cloudflare Tunnel
services:
  api:
    build: ./api
    restart: unless-stopped
    environment:
      NitroDrp__SenderName: ${SENDER_NAME:-Someone}
      NitroDrp__ApiKey: ${API_KEY:-}
      NitroDrp__S3__Bucket: ${S3_BUCKET:-}
      NitroDrp__S3__Region: ${AWS_REGION:-ca-central-1}
      NitroDrp__CloudFront__Domain: ${CLOUDFRONT_DOMAIN:-}
      NitroDrp__CloudFront__KeyPairId: ${CLOUDFRONT_KEY_PAIR_ID:-}
      NitroDrp__CloudFront__DistributionId: ${CLOUDFRONT_DISTRIBUTION_ID:-}
      NitroDrp__CloudFront__PrivateKeyPath: /run/secrets/cloudfront_private_key
      NitroDrp__Dynamo__Table: ${DYNAMO_TABLE:-nitrodrp}
      NitroDrp__Dynamo__Region: ${AWS_REGION:-ca-central-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    expose: ["8080"]
    secrets: [cloudfront_private_key]

  web:
    build: ./web
    restart: unless-stopped
    depends_on: [api]
    environment:
      FRAME_ANCESTORS: ${FRAME_ANCESTORS:-'none'}
    ports: ["8080:80"]

  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: [tunnel]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on: [web]

secrets:
  cloudfront_private_key:
    file: ./secrets/cloudfront-private.pem
