# Production-style stack for the home server. AWS (S3 + DynamoDB) is the backend; see infra/terraform.
#   cp .env.example .env && docker compose up -d --build
#   docker compose --profile tunnel up -d     # also start the Cloudflare Tunnel
services:
  api:
    build: ./api
    restart: unless-stopped
    environment:
      NitroDrp__SenderName: ${SENDER_NAME:-Someone}
      NitroDrp__ApiKey: ${API_KEY:-}
      NitroDrp__S3__Bucket: ${S3_BUCKET:-}
      NitroDrp__S3__Region: ${AWS_REGION:-ca-central-1}
      NitroDrp__CloudFront__Domain: ${CLOUDFRONT_DOMAIN:-}
      NitroDrp__CloudFront__KeyPairId: ${CLOUDFRONT_KEY_PAIR_ID:-}
      NitroDrp__CloudFront__DistributionId: ${CLOUDFRONT_DISTRIBUTION_ID:-}
      NitroDrp__CloudFront__PrivateKeyPath: /run/secrets/cloudfront-private.pem
      NitroDrp__Dynamo__Table: ${DYNAMO_TABLE:-nitrodrp}
      NitroDrp__Dynamo__Region: ${AWS_REGION:-ca-central-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    expose: ["8080"]
    # The CloudFront signing key lives in ./secrets (gitignored). It's a folder mount, not a Docker secret,
    # so a deployment without CloudFront still starts: the API only reads the file when CloudFront is on.
    volumes: ["./secrets:/run/secrets:ro"]

  web:
    build: ./web
    restart: unless-stopped
    depends_on: [api]
    environment:
      FRAME_ANCESTORS: ${FRAME_ANCESTORS:-'none'}
    # Loopback only. The tunnel reaches this container over Docker's internal network, so nothing
    # needs the port open to your LAN. The API trusts the X-Client-IP header nginx builds from
    # CF-Connecting-IP for rate limiting, which anyone who could reach this port directly could forge.
    ports: ["127.0.0.1:8080:80"]

  # Public HTTPS with automatic certificates, for a server with its own public IP (see docs/LIGHTSAIL.md):
  #   docker compose --profile public up -d --build
  caddy:
    image: caddy:2.11.9-alpine
    profiles: [public]
    restart: unless-stopped
    depends_on: [web]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data         # certificates: keep them, Let's Encrypt rate-limits re-issuing
      - caddy_config:/config

  cloudflared:
    image: cloudflare/cloudflared:2026.10.7
    profiles: [tunnel]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on: [web]

volumes:
  caddy_data:
  caddy_config:
