# Production-style stack for the home server. AWS (S3 + DynamoDB) is the backend; see infra/terraform.
#   cp .env.example .env && docker compose up -d --build
#   docker compose --profile tunnel up -d     # also start the Cloudflare Tunnel
services:
  api:
    build: ./api
    restart: unless-stopped
    environment:
      NitroDrp__SenderName: ${SENDER_NAME:-Someone}
      NitroDrp__ApiKey: ${API_KEY:?set API_KEY in .env}
      NitroDrp__S3__Bucket: ${S3_BUCKET:?set S3_BUCKET in .env}
      NitroDrp__S3__Region: ${AWS_REGION:-ca-central-1}
      NitroDrp__Dynamo__Table: ${DYNAMO_TABLE:-nitrodrp}
      NitroDrp__Dynamo__Region: ${AWS_REGION:-ca-central-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?set AWS_ACCESS_KEY_ID in .env}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?set AWS_SECRET_ACCESS_KEY in .env}
    expose: ["8080"]

  web:
    build: ./web
    restart: unless-stopped
    depends_on: [api]
    ports: ["8080:80"]

  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: [tunnel]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in .env}
    depends_on: [web]
