# Local-dev only: sits in front of the S3 emulator (moto) and does what a real S3 bucket's CORS
# rules do (see infra/terraform/main.tf). Browsers upload parts straight to this address, and the
# uploader needs to read each part's ETag from the response, which requires Expose-Headers.
server {
    listen 9000;
    client_max_body_size 0;      # parts are 16 MiB
    proxy_request_buffering off;

    location / {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, PUT, HEAD, OPTIONS" always;
            add_header Access-Control-Allow-Headers "*" always;
            add_header Access-Control-Max-Age 3600 always;
            return 204;
        }
        proxy_pass http://s3:5000;
        proxy_set_header Host $http_host;
        # the emulator's own CORS handling is unreliable, so replace it
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Expose-Headers "ETag" always;
    }
}
