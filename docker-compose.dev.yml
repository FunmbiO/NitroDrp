# Fully local: an S3 emulator and DynamoDB Local stand in for AWS. No AWS account needed.
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
# then open http://localhost:8080 (access key: dev-access-key-change-me)
#
# (MinIO used to fill the S3 role, but its images are no longer published on Docker Hub or Quay.
#  moto is an actively maintained S3 emulator that supports multipart uploads.)
services:
  api:
    environment:
      NitroDrp__ApiKey: dev-access-key-change-me
      NitroDrp__S3__Bucket: nitrodrp-dev
      NitroDrp__S3__ServiceUrl: http://s3:5000
      NitroDrp__S3__PublicServiceUrl: http://localhost:9000
      NitroDrp__S3__ForcePathStyle: "true"
      NitroDrp__S3__AutoCreateBucket: "true"
      NitroDrp__S3__AccessKey: test
      NitroDrp__S3__SecretKey: test
      NitroDrp__Dynamo__ServiceUrl: http://dynamodb:8000
      NitroDrp__Dynamo__AutoCreateTable: "true"
      NitroDrp__Dynamo__AccessKey: local
      NitroDrp__Dynamo__SecretKey: local
      NitroDrp__PublicBaseUrl: http://localhost:8080
      NitroDrp__Auth__Passkeys: "true"
      NitroDrp__Auth__ExtraOrigins__0: http://localhost:5173   # the Vite dev server, if you run it against this API
      NitroDrp__Email__Enabled: "true"
      NitroDrp__Email__FromAddress: transfers@dev.example
      NitroDrp__Email__ServiceUrl: http://s3:5000
      NitroDrp__Email__AutoCreateIdentity: "true"
      NitroDrp__Email__AccessKey: test
      NitroDrp__Email__SecretKey: test
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
    depends_on: [s3, s3-edge, dynamodb]

  s3:
    image: motoserver/moto:5.2.5

  s3-edge:
    image: nginx:1.27-alpine
    depends_on: [s3]
    ports: ["127.0.0.1:9000:9000"]   # the browser on this machine uploads parts here
    volumes: ["./dev/s3-edge.conf:/etc/nginx/conf.d/default.conf:ro"]

  dynamodb:
    image: amazon/dynamodb-local:3.3.2
    command: -jar DynamoDBLocal.jar -sharedDb -inMemory
