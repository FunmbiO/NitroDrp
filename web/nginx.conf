# Real client IP: Cloudflare's header when we're behind the tunnel, else the socket address.
# The API trusts X-Client-IP for rate limiting, so it must only be reachable through this proxy.
map $http_cf_connecting_ip $client_ip {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}

server {
    listen 80;
    root /usr/share/nginx/html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;

    # File bytes never pass through here (browsers talk to S3 directly), so JSON-sized bodies only.
    client_max_body_size 1m;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Client-IP $client_ip;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.html;
    }
}
