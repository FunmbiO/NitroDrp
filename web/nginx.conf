# Rendered by the nginx image's envsubst step: only ${FRAME_ANCESTORS} is a template variable.
# Real client IP, for the API's rate limiting (it trusts the X-Client-IP header set below). Only the proxy
# directly in front of this container may supply it, and each deployment has exactly one:
#   - Cloudflare Tunnel: Cloudflare sets CF-Connecting-IP.
#   - Caddy (docs/LIGHTSAIL.md): Caddy strips any CF-Connecting-IP and sets X-Caddy-Client-IP itself.
#   - Neither (local use): the socket address.
# This container's port is published on 127.0.0.1 only, so nobody can bypass the proxy in front of it.
map $http_x_caddy_client_ip $client_ip_fallback {
    default $http_x_caddy_client_ip;
    ""      $remote_addr;
}

map $http_cf_connecting_ip $client_ip {
    default $http_cf_connecting_ip;
    ""      $client_ip_fallback;
}

server {
    listen 80;
    root /usr/share/nginx/html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    # Who may embed this app in an <iframe>. Default: nobody. Set FRAME_ANCESTORS (see .env.example), e.g.
    # "'self' https://portfolio.example.com". Replaces X-Frame-Options, which can't allow a specific site.
    add_header Content-Security-Policy "frame-ancestors ${FRAME_ANCESTORS}" always;

    # File bytes never pass through here (browsers talk to S3 directly), so JSON-sized bodies only.
    client_max_body_size 1m;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Client-IP $client_ip;
    }

    # Zip downloads stream for as long as the files take: don't buffer them to disk or time them out.
    location ~ ^/api/shares/[^/]+/zip$ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Client-IP $client_ip;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # nginx drops the server-level add_header lines in any location that sets its own,
        # so repeat the security headers here.
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "frame-ancestors ${FRAME_ANCESTORS}" always;
    }

    location / {
        try_files $uri /index.html;
    }
}
